name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/SistemaTaller.Api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore
      # Corre los tests solo si ya existe el proyecto backend/SistemaTaller.Tests (se crea en la Fase 1).
      - name: dotnet test
        run: |
          if ls ../SistemaTaller.Tests/*.csproj >/dev/null 2>&1; then
            dotnet test ../SistemaTaller.Tests
          else
            echo "::warning::Todavia no existe backend/SistemaTaller.Tests - se saltean los tests de backend"
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      # --if-present: no falla mientras no exista el script "test" (Vitest se suma en la Fase 1).
      - run: npm run test --if-present -- --run

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Links rotos y documentos fuera de los índices de docs/ (ver CLAUDE.md -> "Documentación").
      - run: python3 scripts/verificar_docs.py
